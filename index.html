.nm{font-weight:600;flex:1;font-size:14px;min-width:120px} .nx{color:var(--sub);font-size:12.5px}

.body{display:none;padding:4px 15px 15px;border-top:1px solid var(--line)} .card.open .body{display:block}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px}
.field{flex:1;min-width:150px} .field .lbl{font-size:11px;color:var(--sub);margin-bottom:3px}

.ai{background:linear-gradient(135deg,#EEF4FF,#F5F0FF);border:1px solid #C5DAFF;border-radius:9px;padding:11px;margin-top:10px}

// ===== AI 下一步建议引擎(页面内规则) =====
function suggest(c){
  const log=(c.log||'')+' '+(c.next||''), s=c.stage;
  let act='', why=[];
  if(s>=5){act='本周约 15 分钟线上会，带上云方案/成本对比，推动到磐石建档';why.push('阶段='+ST[s].name+'，已建立深度触点，趁热推进');}
  else if(s==4){act='微信 1v1 推送 1 篇同体量落地案例，试探当前云厂与预算';why.push('已加微信但需求未明，先用案例养客');}
  else if(s==3){act='换时段重拨，超 1 分钟直接问体量（自建机房?月成本?用什么云?）';why.push('通了话没加上，按你的 Cold Call 法则加快节奏');}
  else if(s==2){act='周三/周四 14:00-16:00 换时段重拨，备 30 秒强话术';why.push('留言/未接，属可再战，换时段命中率更高');}
  else if(s==1){act='最后一次换号/换时段尝试，无果则降级排除';why.push('纯未接通，按排除法控制精力投入');}
  else{act='暂不主动触达，季度轻回访一次即可';why.push('已死/不对口，节省精力');}
  // 新闻+关键词叠加
  if(/DeepSeek|Zhipu|推理|GPU|算力|AWS|阿里云|火山|华为云|Claude/i.test(log)){
    act='【优先】'+act+'；主打腾讯云 GPU 0.8折 + 推理降价50%，做友商成本对比';
    why.push('命中在用外部云/开源模型 → 对接当前腾讯云降价热点，成本是最强钩子');
  }
  if(/起步|初创|刚/.test(log)){act+='；附 Token Plan 28元/月 + 成长期扶持政策';why.push('成长期客户对成本敏感，扶持政策易破冰');}
  if(c.is_panshi){why.push('已磐石name/KA在跟 → 先对齐主销售，避免重复触达');}
  if(c.is_maibai&&s<=2){act='已陌拜过，改走电话/微信触点，别再跑空地址';why.push('陌拜地址曾跑空，换触达方式');}
  return {act,why:why.join('；')};
}

// ===== AI 日报识别器 =====
function parseReport(){
  const txt=document.getElementById('reportBox').value;if(!txt.trim()){document.getElementById('parseResult').textContent='请先粘贴内容';return;}
  const lines=txt.split(/\n|；|;/).map(l=>l.trim()).filter(Boolean);
  let hits=[], created=[];
  lines.forEach(line=>{
    let best=null;
    DATA.forEach(c=>{
      const keys=[c.name,...(c.alias||[])];
      for(const k of keys){const kk=k.replace(/（北京）|\(北京\)|北京|有限公司|科技|股份|信息|技术|网络|文化/g,'');if(kk.length>=2&&line.includes(kk)){best=c;break;}}
    });
    // 匹配不到已有公司 → 尝试提取公司名并新建
    if(!best){
      const nm=extractCompany(line);
      if(nm){
        best={id:'new_'+Date.now()+'_'+Math.floor(Math.random()*1000),name:nm,stage:2,phone:'',addr:'',tier:'日报新增',
          log:'',next:'首次跟进',date:new Date().toISOString().slice(0,10),play:null,is_maibai:false,is_panshi:false,alias:[],
          prod:'',profit:'',cloud:'',scale:''};
        DATA.push(best);created.push(nm);
      }
    }
    if(best){
      const dm=line.match(/【?(\d{4})】?/);const dt=dm?('2026-'+dm[1].slice(0,2)+'-'+dm[1].slice(2)):best.date;
      best.log=(best.log?best.log+'\n':'')+line;best.date=dt;
      // 阶段线索
      if(/加了?微信|加微|加到.*微信/.test(line)&&best.stage<4)best.stage=4;
      if(/有兴趣|价格|对比|方案|约.*会|拜访|POC|试用/.test(line)&&best.stage<5)best.stage=5;
      if(/婉拒|不需要|拒绝|不做了|解散|不对口|没需求/.test(line))best.stage=0;
      if(/陌拜|敲门/.test(line))best.is_maibai=true;
      if(/磐石|name|KA|建档/.test(line))best.is_panshi=true;
      best.next=suggest(best).act;
      if(created.indexOf(best.name)<0)hits.push(best.name.replace(/（北京）|\(北京\)/g,''));
    }
  });
  render();
  let msg='';
  if(created.length)msg+='🆕 新建 '+created.length+' 家：'+[...new Set(created)].map(n=>n.replace(/（北京）|\(北京\)/g,'')).join('、')+'　';
  if(hits.length)msg+='✅ 更新 '+hits.length+' 家：'+[...new Set(hits)].join('、');
  if(!msg)msg='⚠️ 没识别出公司名。新客户请在句中写明公司名（含"公司/科技/网络"等），或用「+新增客户」手动加';
  document.getElementById('parseResult').textContent=msg;
  document.getElementById('reportBox').value='';
}
// 从一行日报里提取公司名(中文公司名通常以 公司/科技/网络/技术/信息/传媒/文化/集团 等结尾,或含AI品牌名)
function extractCompany(line){
  // 1) 完整公司名(以 有限公司/股份有限公司/有限责任公司 结尾) — 优先,避免把"科技"当后缀截断全名
  let m=line.match(/([\u4e00-\u9fa5A-Za-z0-9.·]{2,20}?(?:股份有限公司|有限责任公司|有限公司))/);
  if(m)return m[1];
  // 2) 品牌式公司名(以 科技/网络/技术/信息/传媒/文化/集团 等结尾)
  m=line.match(/([\u4e00-\u9fa5A-Za-z0-9.·]{2,20}?(?:科技|网络|技术|信息|传媒|文化|集团|工作室|研究院|实验室))/);
  if(m)return m[1];
  // 3) 英文/混合品牌名(如 NeuxMind.AI、XXX.AI)
  m=line.match(/([A-Za-z][A-Za-z0-9]{2,}(?:\.[A-Za-z]{2,})?(?:\.AI|\.ai)?)/);
  if(m&&m[1].length>=3&&!/^\d{4}$/.test(m[1]))return m[1];
  return null;
}

let curView=null;
function toggleView(v){const p=document.getElementById('planPanel');if(curView===v){p.style.display='none';curView=null;return;}curView=v;p.style.display='block';p.innerHTML=(v==='schedule'?genSchedule():genLearnPlan());p.scrollIntoView({behavior:'smooth',block:'start'});}

function genSchedule(){
  // 按阶段+待办排优先级,分配到周一~周五
  const live=DATA.filter(c=>c.stage>0).sort((a,b)=>b.stage-a.stage);
  const days=['周一','周二','周三','周四','周五'];
  const buckets=[[],[],[],[],[]];
  // 热客户(≥4)优先塞前面的天,每天2-3件
  live.forEach((c,i)=>{buckets[i%5].push(c);});
  let h='<h2>📅 下周日程（按优先级自动排，热客户在前）</h2>';
  days.forEach((d,i)=>{
    const items=buckets[i].slice(0,3);if(!items.length)return;
    h+='<div class="day"><div class="dh">'+d+'</div>';
    items.forEach(c=>{const sg=suggest(c);h+='<div class="it"><b>'+ST[c.stage].emoji+' '+c.name.replace(/（北京）|\(北京\)/g,'')+'</b>：'+sg.act.replace(/^【优先】/,'')+'</div>';});
    h+='</div>';
  });
  h+='<div class="tip">规则：阶段分越高越靠前排；每天聚焦 2-3 家避免铺太开。改了阶段/新增客户后重新点「下周日程」即刷新。</div>';
  return h;
}

function genLearnPlan(){
  // 汇总客户需求 → 推导要补的腾讯云产品 + 销售技巧
  const need={gpu:0,inference:0,saas:0,startup:0,migrate:0,visit:0};
  DATA.forEach(c=>{const t=(c.log||'')+(c.next||'');
    if(/GPU|算力|推理|DeepSeek|Zhipu|Claude|大模型/i.test(t))need.inference++;
    if(/AWS|阿里云|火山|华为云|谷歌云|迁移/i.test(t))need.migrate++;
    if(c.stage>=4)need.saas++;
    if(/起步|初创|刚/.test(t))need.startup++;
    if(c.is_maibai)need.visit++;
  });
  let h='<h2>📚 材料准备 + 学习计划（据你的客户需求生成）</h2>';
  // 材料准备
  h+='<div class="lp"><div class="lh">🎒 优先准备的客户材料（点开可下载后发客户）</div>';
  const mats=[
    [need.inference,'推理/GPU 类客户多（'+need.inference+'家）→ 备好','腾讯云大模型AI推理场景方案v1.5','https://lexiangla.com/docs/09707aeb65ec4521b769067954ebdc2e'],
    [need.migrate,'有友商云要迁移（'+need.migrate+'家）→ 备好','算力网络方案(qGPU省成本)+云上好CP案例','https://lexiangla.com/docs/72e0fb966d07459f833329d6aa9ffa75'],
    [need.saas,'已建联待深挖（'+need.saas+'家）→ 备好','大模型推理和应用案例集(含阅文)','https://lexiangla.com/docs/b411ac44a5bd43cbad1b6ba32eaf9153'],
    [need.startup,'成长期客户 → 备好','知识引擎产品介绍及扶持政策','https://lexiangla.com/docs/2138946c8e024b74b315eedf2e819518'],
  ];
  mats.filter(m=>m[0]>0).forEach(m=>{h+='<div class="li">'+m[1]+' <a href="'+m[3]+'" target="_blank">'+m[2]+'</a></div>';});
  h+='</div>';
  // 腾讯云产品学习
  h+='<div class="lp"><div class="lh">☁️ 腾讯云产品学习（补齐当前客户涉及的知识）</div>';
  const prod=[];
  if(need.inference)prod.push('GPU云服务器 / HAI 高性能应用服务：实例选型、vLLM推理部署、0.8折优惠算账（对推理客户）');
  if(need.inference)prod.push('TokenHub / Token Plan：混元/DeepSeek/GLM 各模型定价与降价点，能张口报价');
  if(need.migrate)prod.push('友商对比：腾讯云 vs AWS/阿里云/华为云 的成本与迁移路径（对迁移客户）');
  if(need.saas)prod.push('大模型知识引擎 / AGI 场景方案：SaaS 客户最常问的落地形态');
  prod.push('IaaS 基础路径：CVM → TKE → PaaS/SaaS（周报里 Aaron 推荐的学习顺序）');
  prod.forEach(p=>h+='<div class="li">'+p+'</div>');
  h+='</div>';
  // 销售技巧
  h+='<div class="lp"><div class="lh">🎯 销售技巧学习（结合你的实战短板）</div>';
  const sk=[
    '陌拜破冰：关键词抓注意力（阿里/腾讯/GPU/大模型）→ 聊开 → 自然挖体量（你已有'+need.visit+'家陌拜经验，固化成话术）',
    '电话节奏：超40秒放松输出，超1分钟直接问体量（自建机房?月成本?用什么云?国内国外?）',
    '《大客户销售：谋攻之道》继续推进；《销售巨人》SPIN 提问法——用「未来能看到什么」消除客户决策焦虑',
    '把「被拒是信号而非终点」内化：前台铁板果断止损，聊开但不掌握体量的转找对的人',
  ];
  sk.forEach(s=>h+='<div class="li">'+s+'</div>');
  h+='</div><div class="tip">这份计划随客户数据变化——新增客户或更新需求后重新点「材料/学习计划」即重算。</div>';
  return h;
}

render();
</script></body></html>
