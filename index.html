<style>
:root{--brand:#0052D9;--bg:#F5F7FA;--card:#fff;--line:#E5E8EF;--text:#1D2129;--sub:#86909C}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);padding:18px;line-height:1.5}
.wrap{max-width:1080px;margin:0 auto}
h1{font-size:22px} .date{color:var(--sub);font-size:13px;margin-bottom:14px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.btn{border:1px solid var(--brand);background:var(--brand);color:#fff;border-radius:8px;padding:7px 14px;font-size:13px;cursor:pointer}
.btn.ghost{background:#fff;color:var(--brand)} .btn.gray{background:#fff;color:var(--sub);border-color:var(--line)}
.lock{margin-left:auto;font-size:12.5px;color:var(--sub)} .lock b{color:#E8443C}
.panel{background:var(--card);border-radius:14px;padding:15px 17px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.panel h2{font-size:14px;color:var(--brand);margin-bottom:9px}
.news{font-size:12.5px;color:#4E5969;padding:4px 0;border-bottom:1px dashed var(--line)} .news:last-child{border:none}
.ing textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:13px;min-height:70px;font-family:inherit}
.ing .row{display:flex;gap:8px;margin-top:8px;align-items:center}
.pReport{font-size:12px;color:var(--sub);flex:1}
.todo{display:flex;flex-wrap:wrap;gap:10px} .todo .t{background:#EAF2FF;border:1px solid #C5DAFF;border-radius:10px;padding:9px 13px;font-size:13px;cursor:pointer;flex:1;min-width:230px}
.todo .t:hover{background:#D9E8FF} .todo .t b{color:var(--brand)} .todo .t .act{color:var(--sub);font-size:12px;margin-top:3px}
.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.fbtn{border:1px solid var(--line);background:#fff;border-radius:20px;padding:5px 13px;font-size:12.5px;cursor:pointer;color:var(--sub)} .fbtn.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.group{margin-bottom:6px} .ghd{font-size:13px;font-weight:600;padding:6px 4px;color:var(--sub)} .ghd .n{background:#EEF0F4;border-radius:10px;padding:1px 8px;font-size:12px;margin-left:6px}

.chd{padding:12px 15px;cursor:pointer;display:flex;align-items:center;gap:10px;flex-wrap:wrap}

.nm{font-weight:600;flex:1;font-size:14px;min-width:120px} .nx{color:var(--sub);font-size:12.5px}
.arw{color:var(--sub);transition:.2s;font-size:11px} .card.open .arw{transform:rotate(90deg)}
.body{display:none;padding:4px 15px 15px;border-top:1px solid var(--line)} .card.open .body{display:block}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px}

  else{act='暂不主动触达，季度轻回访一次即可';why.push('已死/不对口，节省精力');}

  if(/DeepSeek|Zhipu|推理|GPU|算力|AWS|阿里云|火山|华为云|Claude/i.test(log)){
    act='【优先】'+act+'；主打腾讯云 GPU 0.8折 + 推理降价50%，做友商成本对比';
    why.push('命中在用外部云/开源模型 → 对接当前腾讯云降价热点，成本是最强钩子');
  }
  if(/起步|初创|刚/.test(log)){act+='；附 Token Plan 28元/月 + 成长期扶持政策';why.push('成长期客户对成本敏感，扶持政策易破冰');}

  reorder();renderTodo();refreshLock();
  const ed=isLogged();
  const list=document.getElementById('list');list.innerHTML='';
  const groups={};DATA.filter(pass).forEach(c=>{(groups[c.stage]=groups[c.stage]||[]).push(c);});
  Object.keys(groups).sort((a,b)=>b-a).forEach(s=>{
    const g=document.createElement('div');g.className='group';
    g.innerHTML='<div class="ghd">'+ST[s].emoji+' '+ST[s].name+'<span class="n">'+groups[s].length+'</span></div>';
    groups[s].forEach(c=>g.appendChild(card(c,ed)));list.appendChild(g);
  });
  save();
}
function stageOptions(sel){return Object.keys(ST).sort((a,b)=>b-a).map(k=>'<option value="'+k+'"'+(k==sel?' selected':'')+'>'+ST[k].emoji+' '+k+' '+ST[k].name+'</option>').join('');}

function card(c,ed){
  const w=document.createElement('div');w.className='card';w.id='card_'+cid(c.id);w.style.borderLeftColor='#'+ST[c.stage].color;
  const D=ed?'':'disabled';
  const play=c.play&&PLAY[c.play]?PLAY[c.play]:null;
  const sg=suggest(c);
  let tags='';if(c.is_maibai)tags+='<span class="tag mb">陌拜</span>';if(c.is_panshi)tags+='<span class="tag ps">磐石name</span>';
  let talkHtml='';
  if(play){
    const mats=play.materials.map(m=>'<a class="mat" href="'+m.u+'" target="_blank">📎 '+m.t+'</a>').join('');
    talkHtml='<div class="field" style="flex-basis:100%"><div class="lbl">💬 可发送话术</div><div class="talk"><button class="copy" onclick="cpTalk(this,event)">复制</button><textarea '+D+' onclick="event.stopPropagation()" onchange="upd(\''+c.id+'\',\'talk_text\',this.value)">'+esc(c.talk_text||play.talk)+'</textarea></div><div class="lbl" style="margin-top:8px">📎 客户材料（点开下载后发客户）</div>'+mats+'</div>';
  }
  w.innerHTML='<div class="chd" onclick="if(event.target.tagName!==\'SELECT\'&&event.target.tagName!==\'INPUT\')this.parentElement.classList.toggle(\'open\')">'
    +'<span class="badge" style="background:#'+ST[c.stage].color+'">'+ST[c.stage].emoji+' '+ST[c.stage].name+'</span>'+tags
    +'<span class="nm">'+esc(c.name)+'</span><span class="nx">▶ '+esc(c.next)+'</span><span class="arw">▶</span></div>'
    +'<div class="body">'
    +'<div class="ai"><div class="h">🤖 AI 建议的下一步动作</div><div class="c">'+sg.act+'</div><div class="why">依据：'+sg.why+'</div>'
      +(ed?'<button onclick="applySuggest(\''+c.id+'\',event)">采纳为下一步</button>':'')+'</div>'
    +'<div class="row"><div class="field" style="max-width:180px"><div class="lbl">阶段（改后自动重排）</div><select '+D+' onclick="event.stopPropagation()" onchange="changeStage(\''+c.id+'\',this.value)">'+stageOptions(c.stage)+'</select></div>'
      +'<div class="field" style="max-width:150px"><div class="lbl">最近更新</div><input '+D+' value="'+esc(c.date)+'" onclick="event.stopPropagation()" onchange="upd(\''+c.id+'\',\'date\',this.value)"></div>'
      +'<div class="field" style="max-width:200px"><div class="lbl">电话</div><input '+D+' value="'+esc(c.phone)+'" onclick="event.stopPropagation()" onchange="upd(\''+c.id+'\',\'phone\',this.value)"></div></div>'
    +'<div class="row"><div class="field" style="max-width:110px"><div class="lbl">陌拜</div><select '+D+' onclick="event.stopPropagation()" onchange="upd(\''+c.id+'\',\'is_maibai\',this.value==\'1\')"><option value="0"'+(!c.is_maibai?' selected':'')+'>否</option><option value="1"'+(c.is_maibai?' selected':'')+'>是</option></select></div>'
      +'<div class="field" style="max-width:130px"><div class="lbl">磐石name</div><select '+D+' onclick="event.stopPropagation()" onchange="upd(\''+c.id+'\',\'is_panshi\',this.value==\'1\')"><option value="0"'+(!c.is_panshi?' selected':'')+'>否</option><option value="1"'+(c.is_panshi?' selected':'')+'>是</option></select></div>'
      +'<div class="field"><div class="lbl">优先动作（下一步）</div><input '+D+' value="'+esc(c.next)+'" onclick="event.stopPropagation()" onchange="upd(\''+c.id+'\',\'next\',this.value)"></div></div>'
    +'<div class="row"><div class="field"><div class="lbl">跟进记录</div><textarea '+D+' onclick="event.stopPropagation()" onchange="upd(\''+c.id+'\',\'log\',this.value)">'+esc(c.log)+'</textarea></div></div>'
    +'<div class="row">'+talkHtml+'</div>'
    +(ed?'<span class="del" onclick="delC(\''+c.id+'\',event)">删除此客户</span>':'')
    +'</div>';
  return w;
}

function upd(id,f,v){const c=DATA.find(x=>String(x.id)==String(id));if(c){c[f]=v;save();render();}}
function changeStage(id,v){const c=DATA.find(x=>String(x.id)==String(id));if(c){c.stage=parseInt(v);render();}}
function applySuggest(id,e){e.stopPropagation();const c=DATA.find(x=>String(x.id)==String(id));if(c){c.next=suggest(c).act;render();}}
function delC(id,e){e.stopPropagation();if(confirm('确定删除该客户？')){DATA=DATA.filter(x=>String(x.id)!=String(id));render();}}
function addCompany(){const name=prompt('新客户公司名？');if(!name)return;DATA.push({id:'new_'+Date.now(),name,stage:2,phone:'',addr:'',tier:'手动新增',log:'',next:'首次拨打',date:new Date().toISOString().slice(0,10),play:null,is_maibai:false,is_panshi:false,alias:[]});render();}
function cpTalk(btn,e){e.stopPropagation();navigator.clipboard.writeText(btn.parentElement.querySelector('textarea').value);btn.textContent='已复制✓';setTimeout(()=>btn.textContent='复制',1500);}
function exportData(){const blob=new Blob([JSON.stringify(DATA,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='客情作战台备份_'+new Date().toISOString().slice(0,10)+'.json';a.click();}

// ===== AI 日报识别器 =====
function parseReport(){
  const txt=document.getElementById('reportBox').value;if(!txt.trim()){document.getElementById('parseResult').textContent='请先粘贴内容';return;}
  const lines=txt.split(/\n|；|;/).map(l=>l.trim()).filter(Boolean);
  let hits=[];
  lines.forEach(line=>{
    let best=null;
    DATA.forEach(c=>{
      const keys=[c.name,...(c.alias||[])];
      for(const k of keys){const kk=k.replace(/（北京）|\(北京\)|北京|有限公司|科技|股份|信息|技术|网络|文化/g,'');if(kk.length>=2&&line.includes(kk)){best=c;break;}}
    });
    if(best){
      const dm=line.match(/【?(\d{4})】?/);const dt=dm?('2026-'+dm[1].slice(0,2)+'-'+dm[1].slice(2)):best.date;
      best.log=(best.log?best.log+'\n':'')+line;best.date=dt;
      // 阶段线索
      if(/加了?微信|加微|加到.*微信/.test(line)&&best.stage<4)best.stage=4;
      if(/有兴趣|价格|对比|方案|约.*会|拜访|POC|试用/.test(line)&&best.stage<5)best.stage=5;
      if(/婉拒|不需要|拒绝|不做了|解散|不对口|没需求/.test(line))best.stage=0;
      if(/陌拜|敲门/.test(line))best.is_maibai=true;
      if(/磐石|name|KA|建档/.test(line))best.is_panshi=true;
      best.next=suggest(best).act;
      hits.push(best.name.replace(/（北京）|\(北京\)/g,''));
    }
  });
  render();
  document.getElementById('parseResult').textContent=hits.length?('✅ 已更新 '+hits.length+' 家：'+[...new Set(hits)].join('、')):'⚠️ 未匹配到已有公司，可用「+新增客户」手动添加';
  document.getElementById('reportBox').value='';
}
render();
</script></body></html>
