function color(id){const s=state[id];if(!s||!s.visited)return '#E8443C';return s.linked?'#0A9D54':'#F0B429';}
function stName(id){const s=state[id];if(!s||!s.visited)return '没去过';return s.linked?'去了+已建联':'去了没建联';}

const svg=document.getElementById('svg');
function applyVB(){svg.setAttribute('viewBox',vb.x+' '+vb.y+' '+vb.w+' '+vb.h);}
document.getElementById('regions').innerHTML=PATHS.map(p=>'<path class="region" d="'+p[1]+'"/>').join('');
document.getElementById('labels').innerHTML=LABELS.map(l=>'<text class="rlabel" x="'+l[1]+'" y="'+l[2]+'">'+l[0]+'</text>').join('');

function pinSVG(p){const c=color(p.id);
  return '<g class="pin" transform="translate('+p.x+','+p.y+')" data-id="'+p.id+'"><path d="M0 -22C-6 -22 -11 -17 -11 -11C-11 -2 0 0 0 0C0 0 11 -2 11 -11C11 -17 6 -22 0 -22Z" fill="'+c+'" stroke="#fff" stroke-width="1.3"/><circle cx="0" cy="-11" r="4.2" fill="#fff"/></g>';}
function draw(){
  document.getElementById('pins').innerHTML=PTS.map(pinSVG).join('');
  document.querySelectorAll('.pin').forEach(g=>{const id=g.getAttribute('data-id');const p=PTS.find(x=>x.id==id);
    g.addEventListener('mouseenter',e=>showTip(e,p));
    g.addEventListener('mousemove',e=>moveTip(e));
    g.addEventListener('mouseleave',()=>document.getElementById('tip').style.display='none');
    g.addEventListener('click',e=>{e.stopPropagation();e.preventDefault();openEdit(e,p);});});
  refreshStat();
}
function showTip(e,p){const t=document.getElementById('tip');
  t.innerHTML='<div class="nm">'+p.name.replace(/（北京）|\(北京\)/g,'')+'</div><span class="st" style="background:'+color(p.id)+'">'+stName(p.id)+'</span>'
    +(p.prod?'<div class="vs"><b>业务：</b>'+p.prod+'</div>':'')+(p.visit?'<div class="vs"><b>陌拜：</b>'+p.visit+'</div>':'')+(p.photo?'<img src="'+p.photo+'">':'');
  t.style.display='block';moveTip(e);}
function moveTip(e){const t=document.getElementById('tip');let x=e.clientX+14,y=e.clientY+14;if(x+260>innerWidth)x=e.clientX-264;if(y+240>innerHeight)y=innerHeight-244;t.style.left=x+'px';t.style.top=y+'px';}

function openEdit(e,p){
  document.getElementById('tip').style.display='none';
  const b=document.getElementById('editbox');const s=state[p.id]||{visited:false,linked:false};
  b.innerHTML='<button class="close" onclick="closeEdit(event)">✕</button><div class="nm">'+p.name.replace(/（北京）|\(北京\)/g,'')+'</div>'
    +'<button style="background:'+(s.visited?'#0A9D54':'#E8443C')+'" onclick="tog(\''+p.id+'\',\'visited\',event)">'+(s.visited?'✓ 去过':'标记去过')+'</button>'
    +'<button style="background:'+(s.linked?'#0052D9':'#86909C')+'" onclick="tog(\''+p.id+'\',\'linked\',event)">'+(s.linked?'✓ 已建联':'标记建联')+'</button>';
  b.style.display='block';openId=p.id;
  let x=e.clientX+10,y=e.clientY+10;if(x+240>innerWidth)x=innerWidth-244;if(y+130>innerHeight)y=innerHeight-134;
  b.style.left=x+'px';b.style.top=y+'px';
}
window.closeEdit=function(e){if(e)e.stopPropagation();document.getElementById('editbox').style.display='none';openId=null;};
window.tog=function(id,f,e){if(e)e.stopPropagation();if(!state[id])state[id]={visited:false,linked:false};state[id][f]=!state[id][f];save();draw();
  const p=PTS.find(x=>x.id==id);const b=document.getElementById('editbox');openEdit({clientX:parseInt(b.style.left),clientY:parseInt(b.style.top)},p);};
function refreshStat(){let v=0,l=0;PTS.forEach(p=>{const s=state[p.id]||{};if(s.visited){v++;if(s.linked)l++;}});
  document.getElementById('stat').textContent='地图上 '+PTS.length+' 家 · 去过 '+v+' · 其中建联 '+l+' · 未去 '+(PTS.length-v);}

// 缩放:围绕中心
window.zoom=function(factor){
  const cx=vb.x+vb.w/2, cy=vb.y+vb.h/2;
  let nw=vb.w/factor, nh=vb.h/factor;
  nw=Math.max(VBW*0.25,Math.min(VBW,nw)); nh=Math.max(VBH*0.25,Math.min(VBH,nh));
  vb.w=nw;vb.h=nh;vb.x=cx-nw/2;vb.y=cy-nh/2;clampVB();applyVB();
};
window.resetView=function(){vb={x:0,y:0,w:VBW,h:VBH};applyVB();};
function clampVB(){if(vb.x<0)vb.x=0;if(vb.y<0)vb.y=0;if(vb.x+vb.w>VBW)vb.x=VBW-vb.w;if(vb.y+vb.h>VBH)vb.y=VBH-vb.h;}
// 滚轮缩放
svg.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.15:1/1.15);},{passive:false});
// 拖动平移
let dragging=false,sx,sy;
svg.addEventListener('mousedown',e=>{if(e.target.closest('.pin'))return;dragging=true;sx=e.clientX;sy=e.clientY;svg.classList.add('drag');});
window.addEventListener('mousemove',e=>{if(!dragging)return;const r=svg.getBoundingClientRect();const kx=vb.w/r.width,ky=vb.h/r.height;vb.x-=(e.clientX-sx)*kx;vb.y-=(e.clientY-sy)*ky;sx=e.clientX;sy=e.clientY;clampVB();applyVB();});
window.addEventListener('mouseup',()=>{dragging=false;svg.classList.remove('drag');});
// 点空白关闭编辑框(排除点在编辑框内/大头针上)
document.addEventListener('mousedown',e=>{if(document.getElementById('editbox').style.display==='block'&&!e.target.closest('#editbox')&&!e.target.closest('.pin'))closeEdit();});
applyVB();draw();
</script></body></html>
