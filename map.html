    // 超出可视区就隐藏
    if(x<-20||y<-20||x>layer.clientWidth+20||y>layer.clientHeight+20){g.style.display='none';return;}
    g.style.display='block';g.style.left=x+'px';g.style.top=y+'px';});
}
function showTip(e,p){const t=document.getElementById('tip');
  const ph=photoOf(p);
  t.innerHTML='<div class="nm">'+p.name.replace(/（北京）|\(北京\)/g,'')+'</div><span class="st" style="background:'+color(p.id)+'">'+stName(p.id)+'</span>'
    +(p.prod?'<div class="vs"><b>业务：</b>'+p.prod+'</div>':'')+(p.visit?'<div class="vs"><b>陌拜：</b>'+p.visit+'</div>':'')
    +(ph.length?'<div style="display:flex;gap:4px;margin-top:6px">'+ph.map(u=>'<img src="'+u+'" style="width:'+(ph.length>1?'33%':'100%')+';border-radius:5px">').join('')+'</div>':'')
    +'<div style="font-size:11px;color:#86909C;margin-top:5px">点击大头针可上传/换照片</div>';
  t.style.display='block';moveTip(e);}
function moveTip(e){const t=document.getElementById('tip');let x=e.clientX+14,y=e.clientY+14;if(x+260>innerWidth)x=e.clientX-264;if(y+240>innerHeight)y=innerHeight-244;t.style.left=x+'px';t.style.top=y+'px';}

function openEdit(e,p){
  document.getElementById('tip').style.display='none';
  const b=document.getElementById('editbox');const s=state[p.id]||{visited:false,linked:false,abandoned:false};
  const ph=photos[p.id]||[];
  let thumbs=ph.map((u,idx)=>'<span style="position:relative;display:inline-block;margin:3px 3px 0 0"><img src="'+u+'" style="width:56px;height:42px;object-fit:cover;border-radius:5px"><span onclick="delPhoto(\''+p.id+'\','+idx+',event)" style="position:absolute;top:-6px;right:-6px;background:#E8443C;color:#fff;border-radius:50%;width:16px;height:16px;font-size:11px;line-height:16px;text-align:center;cursor:pointer">×</span></span>').join('');
  const canAdd=ph.length<3;
  b.innerHTML='<button class="close" onclick="closeEdit(event)">✕</button><div class="nm">'+p.name.replace(/（北京）|\(北京\)/g,'')+'</div>'
    +'<button style="background:'+(s.visited?'#0A9D54':'#E8443C')+'" onclick="tog(\''+p.id+'\',\'visited\',event)">'+(s.visited?'✓ 去过':'标记去过')+'</button>'
    +'<button style="background:'+(s.linked?'#0052D9':'#86909C')+'" onclick="tog(\''+p.id+'\',\'linked\',event)">'+(s.linked?'✓ 已建联':'标记建联')+'</button>'
    +'<div style="font-size:11px;color:#86909C;margin:10px 0 4px">地址（改后按区自动重新定位）</div>'
    +'<input id="addrInput" value="'+(p.addr||'').replace(/"/g,'&quot;')+'" style="width:100%;border:1px solid #E5E8EF;border-radius:6px;padding:6px 8px;font-size:12px" onclick="event.stopPropagation()">'
    +'<button style="background:#0052D9;margin-top:6px" onclick="saveAddr(\''+p.id+'\',event)">保存地址并重定位</button>'
    +'<div style="font-size:11px;color:#86909C;margin:10px 0 4px">现场照片（最多3张，存本机）</div>'
    +'<div>'+thumbs+'</div>'
    +(canAdd?'<div id="pastezone" tabindex="0" style="margin-top:6px;border:1.5px dashed #C5DAFF;border-radius:8px;padding:10px;text-align:center;font-size:12px;color:#0052D9;cursor:pointer;outline:none" onclick="event.stopPropagation();this.focus()">📋 点这里后按 Cmd+V 粘贴截图<br><span style="font-size:11px;color:#86909C">或 <label style="color:#0052D9;cursor:pointer;text-decoration:underline">选择文件<input type="file" accept="image/*" style="display:none" onchange="upPhoto(\''+p.id+'\',this)"></label></span></div>':'<div style="font-size:11px;color:#86909C;margin-top:6px">已满3张，删一张再传</div>');
  b.style.display='block';openId=p.id;
  let x=e.clientX+10,y=e.clientY+10;if(x+250>innerWidth)x=innerWidth-254;if(y+340>innerHeight)y=Math.max(10,innerHeight-344);
  b.style.left=x+'px';b.style.top=y+'px';
  const pz=document.getElementById('pastezone');if(pz)pz.focus();
}
// 保存地址→按区名重定位针
const RCENTER={"东城": [405.5, 342.0], "西城": [369.3, 338.0], "朝阳": [472.6, 317.0], "丰台": [303.0, 398.6], "石景山": [249.4, 331.3], "海淀": [281.6, 260.4], "通州": [604.2, 410.5], "顺义": [602.7, 190.0], "昌平": [266.6, 145.8], "大兴": [439.8, 517.6]};
const ALIAS={"经开":"大兴","经济技术开发区":"大兴","北京经济技术开发区":"大兴","开发区":"大兴"};
function regionOf(addr){for(const r in RCENTER){if(addr.indexOf(r)>=0)return r;}for(const k in ALIAS){if(addr.indexOf(k)>=0)return ALIAS[k];}return null;}
window.saveAddr=function(id,e){if(e)e.stopPropagation();
  const inp=document.getElementById('addrInput');if(!inp)return;const newAddr=inp.value.trim();
  const p=PTS.find(x=>x.id==id);if(!p)return;p.addr=newAddr;
  const r=regionOf(newAddr);
  if(r&&RCENTER[r]){
    // 落到该区中心附近(带小随机偏移避免重叠)
    const c=RCENTER[r];const ang=Math.random()*6.28,rad=10+Math.random()*20;
    p.x=Math.round(c[0]+Math.cos(ang)*rad,1);p.y=Math.round(c[1]+Math.sin(ang)*rad,1);p.region=r;
    saveAddrStore();draw();
    const b=document.getElementById('editbox');openEdit({clientX:parseInt(b.style.left),clientY:parseInt(b.style.top)},p);
    alert('已重定位到「'+r+'」');
  }else{saveAddrStore();alert('地址已存，但没识别出城区（东城/西城/朝阳/丰台/石景山/海淀/通州/顺义/昌平/大兴），针位置未变');}
};
// 地址改动存localStorage(与照片同机制)
const ADDRKEY='kehqing_addr_v1';
function saveAddrStore(){const o={};PTS.forEach(p=>o[p.id]={addr:p.addr,x:p.x,y:p.y,region:p.region});localStorage.setItem(ADDRKEY,JSON.stringify(o));}
function loadAddrStore(){try{const s=localStorage.getItem(ADDRKEY);if(s){const o=JSON.parse(s);PTS.forEach(p=>{if(o[p.id]){p.addr=o[p.id].addr;p.x=o[p.id].x;p.y=o[p.id].y;p.region=o[p.id].region;}});}}catch(e){}}
// 上传照片:读文件→缩到宽320→base64存localStorage
// 通用:把一个图片File/Blob压缩后加到某家照片
function addPhotoFromBlob(id,blob){
  if(!blob){return;}
  if((photos[id]||[]).length>=3){alert('已满3张，先删一张');return;}
  const reader=new FileReader();
  reader.onload=ev=>{
    const img=new Image();
    img.onload=()=>{
      const cv=document.createElement('canvas');const w=320,h=Math.round(img.height*w/img.width);
      cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);
      const b64=cv.toDataURL('image/jpeg',0.6);
      if(!photos[id])photos[id]=[];if(photos[id].length<3)photos[id].push(b64);savePhotos();
      const p=PTS.find(x=>x.id==id);const b=document.getElementById('editbox');openEdit({clientX:parseInt(b.style.left),clientY:parseInt(b.style.top)},p);
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(blob);
}
window.upPhoto=function(id,input){const f=input.files[0];if(f)addPhotoFromBlob(id,f);};
// 粘贴截图:编辑框打开时,Cmd+V把剪贴板图片贴给openId那家
document.addEventListener('paste',e=>{
  if(!openId)return;
  const items=(e.clipboardData||{}).items||[];
  for(const it of items){
    if(it.type&&it.type.indexOf('image')===0){
      const blob=it.getAsFile();if(blob){e.preventDefault();addPhotoFromBlob(openId,blob);}
      break;
    }
  }
});
window.delPhoto=function(id,idx,e){if(e)e.stopPropagation();if(photos[id]){photos[id].splice(idx,1);savePhotos();const p=PTS.find(x=>x.id==id);const b=document.getElementById('editbox');openEdit({clientX:parseInt(b.style.left),clientY:parseInt(b.style.top)},p);}};
// 看板改动后,跨页面实时同步:重载共享数据并重绘
window.addEventListener('storage',e=>{if(e.key===KEY){try{SHARED=JSON.parse(e.newValue||'[]');}catch(_){SHARED=loadShared();}syncState();draw();}});
window.closeEdit=function(e){if(e)e.stopPropagation();document.getElementById('editbox').style.display='none';openId=null;};
window.tog=function(id,f,e){if(e)e.stopPropagation();const c=SHARED.find(x=>String(x.id)==String(id));if(!c)return;
  if(f=='visited')c.is_maibai=!c.is_maibai; else if(f=='linked')c.stage=(c.stage>=4)?3:4;
  saveShared();syncState();draw();
  const p=PTS.find(x=>x.id==id);const b=document.getElementById('editbox');openEdit({clientX:parseInt(b.style.left),clientY:parseInt(b.style.top)},p);};
function refreshStat(){let v=0,l=0;PTS.forEach(p=>{const s=state[p.id]||{};if(s.visited){v++;if(s.linked)l++;}});
  document.getElementById('stat').textContent='地图上 '+PTS.length+' 家 · 去过 '+v+' · 其中建联 '+l+' · 未去 '+(PTS.length-v);}

// 缩放:围绕中心
window.zoom=function(factor){
  const cx=vb.x+vb.w/2, cy=vb.y+vb.h/2;
  let nw=vb.w/factor, nh=vb.h/factor;
  nw=Math.max(VBW*0.25,Math.min(VBW,nw)); nh=Math.max(VBH*0.25,Math.min(VBH,nh));
  vb.w=nw;vb.h=nh;vb.x=cx-nw/2;vb.y=cy-nh/2;clampVB();applyVB();
};
window.resetView=function(){vb={x:0,y:0,w:VBW,h:VBH};applyVB();};
function clampVB(){if(vb.x<0)vb.x=0;if(vb.y<0)vb.y=0;if(vb.x+vb.w>VBW)vb.x=VBW-vb.w;if(vb.y+vb.h>VBH)vb.y=VBH-vb.h;}
// 滚轮缩放
svg.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.15:1/1.15);},{passive:false});
// 拖动平移
let dragging=false,sx,sy;
svg.addEventListener('mousedown',e=>{if(e.target.closest('.pin'))return;dragging=true;sx=e.clientX;sy=e.clientY;svg.classList.add('drag');});
window.addEventListener('mousemove',e=>{if(!dragging)return;const r=svg.getBoundingClientRect();const kx=vb.w/r.width,ky=vb.h/r.height;vb.x-=(e.clientX-sx)*kx;vb.y-=(e.clientY-sy)*ky;sx=e.clientX;sy=e.clientY;clampVB();applyVB();});
window.addEventListener('mouseup',()=>{dragging=false;svg.classList.remove('drag');});
// 点空白关闭编辑框(排除点在编辑框内/大头针上)
document.addEventListener('mousedown',e=>{if(document.getElementById('editbox').style.display==='block'&&!e.target.closest('#editbox')&&!e.target.closest('.pin'))closeEdit();});
window.addEventListener('resize',positionPins);
loadAddrStore();applyVB();draw();
</script></body></html>
