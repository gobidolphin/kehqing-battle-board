let state=load();
function load(){try{const s=localStorage.getItem(KEY);if(s)return JSON.parse(s);}catch(e){}
  const o={};PTS.forEach(p=>o[p.id]={visited:p.visited,linked:p.stage>=4});return o;}
function save(){localStorage.setItem(KEY,JSON.stringify(state));}
function color(id){const s=state[id];if(!s||!s.visited)return '#E8443C';return s.linked?'#0A9D54':'#F0B429';}
function stName(id){const s=state[id];if(!s||!s.visited)return '没去过';return s.linked?'去了+已建联':'去了没建联';}

function pinSVG(p){
  const c=color(p.id);
  return '<g class="pin" transform="translate('+p.x+','+p.y+')" data-id="'+p.id+'">'
    +'<path d="M0 -26C-7 -26 -13 -20 -13 -13C-13 -3 0 0 0 0C0 0 13 -3 13 -13C13 -20 7 -26 0 -26Z" fill="'+c+'" stroke="#fff" stroke-width="1.5"/>'
    +'<circle cx="0" cy="-13" r="5" fill="#fff"/></g>';
}
function draw(){
  document.getElementById('pins').innerHTML=PTS.map(pinSVG).join('');
  document.querySelectorAll('.pin').forEach(g=>{
    const id=g.getAttribute('data-id');const p=PTS.find(x=>x.id==id);
    g.addEventListener('mousemove',e=>showTip(e,p));
    g.addEventListener('mouseleave',()=>document.getElementById('tip').style.display='none');
    g.addEventListener('click',e=>{e.stopPropagation();openEdit(e,p);});
  });
  refreshStat();
}
function showTip(e,p){
  const t=document.getElementById('tip');
  t.innerHTML='<div class="nm">'+p.name.replace(/（北京）|\(北京\)/g,'')+'</div>'
    +'<span class="st" style="background:'+color(p.id)+'">'+stName(p.id)+'</span>'
    +(p.prod?'<div class="vs"><b>业务：</b>'+p.prod+'</div>':'')
    +(p.visit?'<div class="vs"><b>陌拜：</b>'+p.visit+'</div>':'')
    +(p.photo?'<img src="'+p.photo+'">':'');
  t.style.display='block';
  let x=e.clientX+14,y=e.clientY+14;
  if(x+260>innerWidth)x=e.clientX-264; if(y+240>innerHeight)y=innerHeight-244;
  t.style.left=x+'px';t.style.top=y+'px';
}
function openEdit(e,p){
  document.getElementById('tip').style.display='none';
  const b=document.getElementById('editbox');const s=state[p.id]||{visited:false,linked:false};
  b.innerHTML='<button class="close" onclick="document.getElementById(\'editbox\').style.display=\'none\'">✕</button>'
    +'<div class="nm">'+p.name.replace(/（北京）|\(北京\)/g,'')+'</div>'
    +'<button style="background:'+(s.visited?'#0A9D54':'#E8443C')+'" onclick="tog(\''+p.id+'\',\'visited\')">'+(s.visited?'✓ 去过':'标记去过')+'</button>'
    +'<button style="background:'+(s.linked?'#0052D9':'#86909C')+'" onclick="tog(\''+p.id+'\',\'linked\')">'+(s.linked?'✓ 已建联':'标记建联')+'</button>';
  b.style.display='block';
  let x=e.clientX+10,y=e.clientY+10;if(x+240>innerWidth)x=innerWidth-244;if(y+120>innerHeight)y=innerHeight-124;
  b.style.left=x+'px';b.style.top=y+'px';
}
window.tog=function(id,f){if(!state[id])state[id]={visited:false,linked:false};state[id][f]=!state[id][f];save();draw();
  const p=PTS.find(x=>x.id==id);const ev={clientX:parseInt(document.getElementById('editbox').style.left),clientY:parseInt(document.getElementById('editbox').style.top)};openEdit(ev,p);};
function refreshStat(){let v=0,l=0;PTS.forEach(p=>{const s=state[p.id]||{};if(s.visited){v++;if(s.linked)l++;}});
  document.getElementById('stat').textContent='地图上 '+PTS.length+' 家 · 去过 '+v+' · 其中建联 '+l+' · 未去 '+(PTS.length-v);}
document.addEventListener('click',()=>document.getElementById('editbox').style.display='none');
draw();
</script></body></html>
